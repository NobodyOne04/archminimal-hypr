# Night light (hyprsunset). Warm screen in the evening, neutral in the day.
# The bar's `nl` module and Super+Shift+W toggle it by hand; the next profile
# below takes over again at its time. The bar toggle's warmth is
# Theme.nightTemp in quickshell/Theme.qml.

profile {
    time = 7:00
    identity = true
}

profile {
    time = 21:00
    temperature = 4000
}
