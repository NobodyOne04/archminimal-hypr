# Idle handling for a laptop: dim, lock, screen off, suspend.

general {
    # the login-screen look (quickshell/Lock.qml); hyprlock only if the shell is down
    lock_cmd = qs -c archminimal ipc call lock lock || pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session      # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 4 min: dim the screen
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 15 min: suspend
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
