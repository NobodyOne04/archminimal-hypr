# Lock screen in the same style as the archminimal login screen.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.local/share/archminimal/wallpaper.png
    color = rgb(28292d)
    blur_passes = 0
}

# top-left label
label {
    monitor =
    text = <span letter_spacing="2048">ARCH//LINUX</span>
    color = rgb(7d8088)
    font_size = 11
    font_family = JetBrains Mono
    position = 44, -44
    halign = left
    valign = top
}

# clock, top-right
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = rgb(d0d2d0)
    font_size = 22
    font_family = JetBrains Mono Light
    position = -44, -36
    halign = right
    valign = top
}
label {
    monitor =
    text = cmd[update:60000] date "+%a %d %b" | tr '[:lower:]' '[:upper:]'
    color = rgb(7d8088)
    font_size = 10
    font_family = JetBrains Mono
    position = -44, -76
    halign = right
    valign = top
}

# password, under the logo (same place as on the login screen)
input-field {
    monitor =
    size = 300, 36
    outline_thickness = 1
    outer_color = rgba(4a4c54ff)
    inner_color = rgba(00000000)
    font_color = rgb(d0d2d0)
    check_color = rgb(00e5ff)
    fail_color = rgb(ff2a6d)
    fail_text = authentication failed
    placeholder_text = <span foreground="##7d8088" letter_spacing="3072">password</span>
    dots_size = 0.18
    dots_spacing = 0.6
    dots_center = true
    fade_on_empty = false
    rounding = 0
    font_family = JetBrains Mono
    position = 0, -216
    halign = center
    valign = center
}

label {
    monitor =
    text = <span letter_spacing="2048">sys::locked</span>
    color = rgb(7d8088)
    font_size = 10
    font_family = JetBrains Mono
    position = 0, -258
    halign = center
    valign = center
}
