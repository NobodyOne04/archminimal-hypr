# archminimal · kitty
# Same palette as the bar, launcher and login screen.

# ---- font ----
font_family      JetBrains Mono
font_size        11
# no ligatures: what you type is what you see
disable_ligatures always

# ---- colors ----
background            #18191d
foreground            #d0d2d0
cursor                #00e5ff
cursor_text_color     #18191d
selection_background  #00e5ff
selection_foreground  #000000
url_color             #00e5ff

color0   #28292d
color1   #ff2a6d
color2   #9ece6a
color3   #e0af68
color4   #5ab0f6
color5   #b48ef7
color6   #00e5ff
color7   #d0d2d0
color8   #4a4c54
color9   #ff5c8a
color10  #b5e08a
color11  #f0c88a
color12  #8ccaff
color13  #cdb1ff
color14  #7af2ff
color15  #f2f3f2

# a hint of the wallpaper; Hyprland blur stays off
background_opacity 0.96

# ---- window ----
# Hyprland draws the 1px cyan border
hide_window_decorations yes
# vertical horizontal
window_padding_width 12 14
placement_strategy center
confirm_os_window_close 0
# Hyprland sizes the window. Remembering the last size also restored its
# "maximized" state, so each new kitty covered the others.
remember_window_size no
enable_audio_bell no
update_check_interval 0

# splits inside kitty (ctrl+shift+enter)
active_border_color   #00e5ff
inactive_border_color #3a3c44

# ---- tabs: one quiet line at the bottom ----
tab_bar_edge            bottom
tab_bar_style           separator
tab_separator           " │ "
tab_bar_background      #18191d
active_tab_foreground   #00e5ff
active_tab_background   #18191d
active_tab_font_style   bold
inactive_tab_foreground #7d8088
inactive_tab_background #18191d

# ---- cursor & input ----
cursor_shape          block
cursor_blink_interval 0.5
# keep the block cursor in every shell
shell_integration     no-cursor
# hide the mouse while typing
mouse_hide_wait       -1
copy_on_select        clipboard

# ---- keys (ctrl+shift+c/v copy/paste and ctrl+shift+t/enter are built in) ----
map ctrl+plus  change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0
